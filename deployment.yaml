apiVersion: apps/v1
kind: Deployment

metadata:
  name: explorecountrydata-app 

spec:
  replicas: 2

  selector:
    matchLabels:
      app: explorecountrydata-app 

  template:
    metadata:
      labels:
        app: explorecountrydata-app 

    spec:
      containers:
        - name: explorecountrydata-app 
          image:  country_data_api_explorer/v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 6000