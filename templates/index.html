<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rest Countries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container" style="max-width: 60%;">
      <div class="py-5 text-center">
        <h2>Country Data Explorer</h2>
        <p class="lead">A Flask App for Querying the Rest Countries API</p>
      </div>
      <form action="{{ url_for('search')}}"  method="POST">
      <div class="row">
        <div class="col-md-4 order-md-2 mb-4">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">Select A Search Tag</span>
          </h4>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Capital City</h6>
              </div>
              <input type="checkbox" id="capitals" name="capitals" >
            </li>
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Region</h6>
              </div>
              <input type="checkbox" id="region" name="region" >
            </li>
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Flag</h6>
              </div>
              <input type="checkbox" id="flag.url_png" name="flag.url_png">
            </li>
          </ul>
        </div>


        <div class="col-md-8 order-md-2 mb-4">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">&nbsp;</span>
          </h4>
          
          <div class="input-group">
            <div class="col-md-5">
              <select class="form-select" id="country" name="country" required>
                <option value="">Select a Country...</option>
                {% for country in country_list %}
                  <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
              </select>
            </div>
            <button type="submit" class="btn btn-secondary">Search</button>
          </div>

          <div class="row">
            <div class="col-12">
              <hr>
            </div>  
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h5>Results</h5>
                </div>
                <div class="card-body">
                  <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between lh-sm">
                      <div>
                        <h6 class="my-0">Capital City</h6>
                      </div>
                      <p class="text-muted">Hello</p>
                    </li>
                    <li class="list-group-item d-flex justify-content-between lh-sm">
                      <div>
                        <h6 class="my-0">Region</h6>
                      </div>
                      <p class="text-muted">Hello</p>
                    </li>
                    <li class="list-group-item d-flex justify-content-between lh-sm">
                      <div>
                        <h6 class="my-0">Flag</h6>
                      </div>
                      <img src="flag.url_png" alt="flag.url_png" height="100px" width="100px">
                    </li>
                  </ul>
                </div>


              </div>


            </div>
          </div>



        </div>
      </div>
    </div>
  </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
