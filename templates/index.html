<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rest Countries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container" style="max-width: 60%;">
      <div class="py-5 text-center">
        <h2>Country Data Explorer</h2>
        <p class="lead">A Flask App for Querying the Rest Countries API</p>
      </div>
      <form method="POST">
      <div class="row">
        <div class="col-md-4 order-md-2 mb-4">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">Select A Search Tag</span>
          </h4>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Capital City</h6>
              </div>
              <input type="checkbox" id="capitals" name="capitals" value="capitals">
            </li>
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Region</h6>
              </div>
              <input type="checkbox" id="region" name="region" value="region">
            </li>
            <li class="list-group-item d-flex justify-content-between lh-sm">
              <div>
                <h6 class="my-0">Flag</h6>
              </div>
              <input type="checkbox" id="flag.url_png" name="flag.url_png" value="flag.url_png">
            </li>
          </ul>
        </div>


        <div class="col-md-8 order-md-2 mb-4">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">&nbsp;</span>
          </h4>
          
          <div class="input-group">
            <div class="col-md-5">
              <select class="form-select" id="country" required>
                <option value="">Select a Country...</option>
                <option>Pakistan</option>
              </select>
            </div>
            <button type="submit" class="btn btn-secondary">Search</button>
          </div>
        </div>
      </div>
    </div>
  </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
